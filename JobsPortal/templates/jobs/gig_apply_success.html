{% extends 'base.html' %}
{% block title %}Application Submitted - BotsJobs{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-16 text-center">
    <div class="bg-white rounded-xl shadow-sm p-12">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-4">Application Submitted!</h1>
        <p class="text-gray-600 mb-8">Thank you for applying to <strong>"{{ gig.title }}"</strong>. The poster has been notified and will contact you if interested.</p>
        <a href="{% url 'gig_list' %}" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-blue-700 transition">Browse More Gigs</a>
    </div>
</div>
{% endblock %}
