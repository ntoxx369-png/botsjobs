{% extends 'base.html' %}
{% block title %}Apply to Gig - {{ gig.title }} - BotsJobs{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <div class="bg-white rounded-xl shadow-sm p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Apply to "{{ gig.title }}"</h1>
        <p class="text-gray-600 mb-6">Posted by {{ gig.poster.username }} &middot; {{ gig.get_location_display }}</p>
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
                <input type="text" name="full_name" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
                <input type="email" name="email" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label>
                <input type="tel" name="phone" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="+267...">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Your Quote (BWP) - Optional</label>
                <input type="number" name="quote_amount" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="e.g. 500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Message *</label>
                <textarea name="message" rows="4" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="Tell the poster why you're a good fit..."></textarea>
            </div>
            <div class="flex gap-4">
                <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">Submit Application</button>
                <a href="{% url 'gig_detail' gig.id %}" class="px-6 py-3 border border-gray-300 rounded-lg font-semibold hover:bg-gray-50 transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
