{% extends 'base.html' %}
{% block title %}Edit Resume - BotsJobs{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <div class="bg-white rounded-xl shadow-sm p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Edit Your Resume</h1>
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" name="full_name" value="{{ resume.full_name }}" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                    <input type="tel" name="phone" value="{{ resume.phone }}" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="+267...">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Professional Headline</label>
                <input type="text" name="headline" value="{{ resume.headline }}" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="e.g. Junior Software Developer">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Summary</label>
                <textarea name="summary" rows="4" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300">{{ resume.summary }}</textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Skills (comma-separated)</label>
                <input type="text" name="skills" value="{{ resume.skills }}" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="Python, Django, JavaScript, ...">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Work Experience</label>
                <textarea name="experience" rows="4" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300">{{ resume.experience }}</textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Education</label>
                <textarea name="education" rows="3" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300">{{ resume.education }}</textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Upload Resume File (PDF - optional)</label>
                <input type="file" name="resume_file" accept=".pdf" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300">
                {% if resume.resume_file %}
                <p class="text-sm text-gray-500 mt-1">Current: {{ resume.resume_file.name }}</p>
                {% endif %}
            </div>
            <div class="flex gap-4">
                <button type="submit" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-blue-700">Save Resume</button>
                <a href="{% url 'profile' %}" class="px-8 py-3 border border-gray-300 rounded-lg font-semibold hover:bg-gray-50">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
