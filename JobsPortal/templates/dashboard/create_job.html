{% extends 'base.html' %}
{% block title %}Post a Job - BotJobs{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <div class="bg-white rounded-xl shadow-sm p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Post a New Job</h1>
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Job Title *</label>
                <input type="text" name="title" required placeholder="e.g. Senior Software Engineer" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300">
            </div>
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Location *</label>
                    <select name="location" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300">
                        {% for loc in locations %}
                        <option value="{{ loc.0 }}">{{ loc.1 }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Job Type *</label>
                    <select name="job_type" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300">
                        {% for jt in job_types %}
                        <option value="{{ jt.0 }}">{{ jt.1 }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Industry *</label>
                <select name="industry" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300">
                    {% for ind in industries %}
                    <option value="{{ ind.0 }}">{{ ind.1 }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Minimum Salary (BWP)</label>
                    <input type="number" name="salary_min" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="e.g. 15000">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Maximum Salary (BWP)</label>
                    <input type="number" name="salary_max" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="e.g. 25000">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Application Deadline *</label>
                <input type="date" name="deadline" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Job Description *</label>
                <textarea name="description" required rows="6" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="Describe the role, responsibilities, and what you're looking for..."></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Requirements *</label>
                <textarea name="requirements" required rows="6" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="List qualifications, skills, and experience needed..."></textarea>
            </div>
            <div class="flex gap-4">
                <button type="submit" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-blue-700">Post Job</button>
                <a href="{% url 'manage_jobs' %}" class="px-8 py-3 border border-gray-300 rounded-lg font-semibold hover:bg-gray-50">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
